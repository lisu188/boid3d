<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boid3D — Working Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#dce8f2;font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}.hud{position:fixed;left:20px;top:20px;z-index:2;display:flex;gap:12px;align-items:flex-start;pointer-events:none}.panel{background:rgba(7,16,24,.78);border:1px solid rgba(166,210,255,.16);box-shadow:0 16px 44px rgba(0,0,0,.28);backdrop-filter:blur(12px);border-radius:14px;padding:14px 16px;pointer-events:auto}.title{font-weight:750;letter-spacing:.02em;font-size:16px;margin-bottom:6px}.sub{opacity:.66;font-size:12px}.stats{margin-top:10px;display:grid;grid-template-columns:auto auto;gap:3px 14px;font-variant-numeric:tabular-nums}.controls{position:fixed;right:20px;top:20px;z-index:2;width:230px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0}.row label{opacity:.78}.row input[type=range]{width:120px}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button{flex:1;background:#122230;color:#e8f2fa;border:1px solid rgba(166,210,255,.18);border-radius:9px;padding:8px 10px;cursor:pointer}.buttons button:hover{background:#173044}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(7,16,24,.65);border:1px solid rgba(166,210,255,.12);font-size:12px;opacity:.76;pointer-events:none}@media(max-width:720px){.controls{right:12px;top:auto;bottom:52px;width:200px}.hud{left:12px;top:12px}.hint{bottom:12px}.sub{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="panel"><div class="title">Boid3D</div><div class="sub">3D flocking simulation · cohesion · alignment · separation</div><div class="stats"><span>Boids</span><b id="boidsStat">500</b><span>FPS</span><b id="fpsStat">0</b><span>Neighbors</span><b id="neighborStat">0</b></div></div></div>
<div class="panel controls"><div class="row"><label>Boids</label><input id="count" type="range" min="100" max="1000" step="100" value="500"></div><div class="row"><label>Cohesion</label><input id="cohesion" type="range" min="0" max="2" step="0.05" value="0.80"></div><div class="row"><label>Alignment</label><input id="alignment" type="range" min="0" max="2" step="0.05" value="1.10"></div><div class="row"><label>Separation</label><input id="separation" type="range" min="0" max="3" step="0.05" value="1.60"></div><div class="buttons"><button id="pause">Pause</button><button id="reset">Reset</button></div></div>
<div class="hint">Drag to orbit · mouse wheel to zoom · Space to pause</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const countEl=document.getElementById('count'),cohesionEl=document.getElementById('cohesion'),alignmentEl=document.getElementById('alignment'),separationEl=document.getElementById('separation');
const boidsStat=document.getElementById('boidsStat'),fpsStat=document.getElementById('fpsStat'),neighborStat=document.getElementById('neighborStat'),pauseBtn=document.getElementById('pause'),resetBtn=document.getElementById('reset');
let W=0,H=0,DPR=1,boids=[],paused=false,last=performance.now(),fpsTime=last,fpsFrames=0,yaw=-.55,pitch=-.24,cameraDist=92,drag=false,px=0,py=0,avgNeighbors=0;
const AREA=27,NEIGHBOR=10.5,SEPARATION=3.5,MIN_SPEED=4,MAX_SPEED=9,MAX_FORCE=9.5,CELL=11,WANDER=.28,BOUNDARY=2.4,MARGIN=8;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function len(x,y,z){return Math.hypot(x,y,z)}
function reset(n=+countEl.value){boids=new Array(n);for(let i=0;i<n;i++){let x=rand(-AREA*.8,AREA*.8),y=rand(-AREA*.8,AREA*.8),z=rand(-AREA*.8,AREA*.8),vx=rand(-1,1),vy=rand(-1,1),vz=rand(-1,1),l=len(vx,vy,vz)||1,s=rand(MIN_SPEED,MAX_SPEED);boids[i]={x,y,z,vx:vx/l*s,vy:vy/l*s,vz:vz/l*s,wx:vx/l,wy:vy/l,wz:vz/l}}boidsStat.textContent=n}
reset();
function hashKey(x,y,z){return x+','+y+','+z}
function step(dt){const grid=new Map();for(let i=0;i<boids.length;i++){const b=boids[i],cx=Math.floor(b.x/CELL),cy=Math.floor(b.y/CELL),cz=Math.floor(b.z/CELL),k=hashKey(cx,cy,cz);let arr=grid.get(k);if(!arr)grid.set(k,arr=[]);arr.push(i)}let totalNeighbors=0;const cw=+cohesionEl.value,aw=+alignmentEl.value,sw=+separationEl.value;for(let i=0;i<boids.length;i++){const b=boids[i],cx=Math.floor(b.x/CELL),cy=Math.floor(b.y/CELL),cz=Math.floor(b.z/CELL);let count=0,px=0,py=0,pz=0,avx=0,avy=0,avz=0,sx=0,sy=0,sz=0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){const arr=grid.get(hashKey(cx+dx,cy+dy,cz+dz));if(!arr)continue;for(const j of arr){if(j===i)continue;const o=boids[j],rx=o.x-b.x,ry=o.y-b.y,rz=o.z-b.z,d2=rx*rx+ry*ry+rz*rz;if(d2<NEIGHBOR*NEIGHBOR){count++;px+=o.x;py+=o.y;pz+=o.z;avx+=o.vx;avy+=o.vy;avz+=o.vz;if(d2<SEPARATION*SEPARATION&&d2>.0001){const d=Math.sqrt(d2),q=(SEPARATION-d)/SEPARATION;sx-=rx/d*q;sy-=ry/d*q;sz-=rz/d*q}}}}let fx=0,fy=0,fz=0;if(count){totalNeighbors+=count;px=px/count-b.x;py=py/count-b.y;pz=pz/count-b.z;let l=len(px,py,pz)||1;fx+=px/l*cw;fy+=py/l*cw;fz+=pz/l*cw;avx/=count;avy/=count;avz/=count;l=len(avx,avy,avz)||1;const vl=len(b.vx,b.vy,b.vz)||1;fx+=(avx/l-b.vx/vl)*aw;fy+=(avy/l-b.vy/vl)*aw;fz+=(avz/l-b.vz/vl)*aw;fx+=sx*sw;fy+=sy*sw;fz+=sz*sw}let bx=0,by=0,bz=0;if(b.x<-AREA+MARGIN)bx+=1;else if(b.x>AREA-MARGIN)bx-=1;if(b.y<-AREA+MARGIN)by+=1;else if(b.y>AREA-MARGIN)by-=1;if(b.z<-AREA+MARGIN)bz+=1;else if(b.z>AREA-MARGIN)bz-=1;let bl=len(bx,by,bz);if(bl){fx+=bx/bl*BOUNDARY;fy+=by/bl*BOUNDARY;fz+=bz/bl*BOUNDARY}b.wx+=rand(-1,1)*dt*.9;b.wy+=rand(-1,1)*dt*.9;b.wz+=rand(-1,1)*dt*.9;let wl=len(b.wx,b.wy,b.wz)||1;b.wx/=wl;b.wy/=wl;b.wz/=wl;fx+=b.wx*WANDER;fy+=b.wy*WANDER;fz+=b.wz*WANDER;let fl=len(fx,fy,fz);if(fl>MAX_FORCE){fx=fx/fl*MAX_FORCE;fy=fy/fl*MAX_FORCE;fz=fz/fl*MAX_FORCE}b.vx+=fx*dt*4.2;b.vy+=fy*dt*4.2;b.vz+=fz*dt*4.2;let sp=len(b.vx,b.vy,b.vz)||1;if(sp>MAX_SPEED){b.vx=b.vx/sp*MAX_SPEED;b.vy=b.vy/sp*MAX_SPEED;b.vz=b.vz/sp*MAX_SPEED}else if(sp<MIN_SPEED){b.vx=b.vx/sp*MIN_SPEED;b.vy=b.vy/sp*MIN_SPEED;b.vz=b.vz/sp*MIN_SPEED}b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt}avgNeighbors=boids.length?totalNeighbors/boids.length:0}
function rotate(x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const x1=cy*x-sy*z,z1=sy*x+cy*z;return [x1,cp*y-sp*z1,sp*y+cp*z1]}
function project(x,y,z){const r=rotate(x,y,z),depth=r[2]+cameraDist;if(depth<3)return null;const f=Math.min(W,H)*1.02/depth;return [W*.5+r[0]*f,H*.5-r[1]*f,depth,f]}
function drawBox(){const pts=[];for(let x of[-AREA,AREA])for(let y of[-AREA,AREA])for(let z of[-AREA,AREA])pts.push({x,y,z,p:project(x,y,z)});const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];ctx.strokeStyle='rgba(130,190,230,.10)';ctx.lineWidth=1;ctx.beginPath();for(const [a,b] of edges){const p=pts[a].p,q=pts[b].p;if(!p||!q)continue;ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}ctx.stroke()}
function draw(){ctx.fillStyle='#071018';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.7);g.addColorStop(0,'rgba(35,80,110,.16)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawBox();const items=[];for(const b of boids){const p=project(b.x,b.y,b.z);if(!p)continue;const vtip=project(b.x+b.vx*.7,b.y+b.vy*.7,b.z+b.vz*.7);if(!vtip)continue;items.push({b,p,v:vtip})}items.sort((a,b)=>b.p[2]-a.p[2]);for(const o of items){const [x,y,d,f]=o.p,dx=o.v[0]-x,dy=o.v[1]-y,dl=Math.hypot(dx,dy)||1,ux=dx/dl,uy=dy/dl,nx=-uy,ny=ux,s=Math.max(1.7,Math.min(6.5,70/d));const tail=s*2.0,wing=s*1.15,alpha=Math.max(.32,Math.min(.95,1.25-d/(cameraDist+AREA)*.7));ctx.beginPath();ctx.moveTo(x+ux*tail,y+uy*tail);ctx.lineTo(x-ux*tail*.8+nx*wing,y-uy*tail*.8+ny*wing);ctx.lineTo(x-ux*tail*.25,y-uy*tail*.25);ctx.lineTo(x-ux*tail*.8-nx*wing,y-uy*tail*.8-ny*wing);ctx.closePath();ctx.fillStyle=`rgba(119,207,255,${alpha})`;ctx.fill()}ctx.fillStyle='rgba(208,237,255,.45)';ctx.font='12px system-ui';ctx.fillText('simulation volume',24,H-28)}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)step(dt);draw();fpsFrames++;if(now-fpsTime>500){fpsStat.textContent=Math.round(fpsFrames*1000/(now-fpsTime));neighborStat.textContent=avgNeighbors.toFixed(1);fpsFrames=0;fpsTime=now}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-px)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{cameraDist=Math.max(48,Math.min(160,cameraDist+e.deltaY*.07));e.preventDefault()},{passive:false});
function toggle(){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}
pauseBtn.onclick=toggle;resetBtn.onclick=()=>reset();countEl.oninput=()=>reset(+countEl.value);addEventListener('keydown',e=>{if(e.code==='Space'){toggle();e.preventDefault()}});
</script>
</body>
</html>
